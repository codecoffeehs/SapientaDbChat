[package]
name = "sapienta-db-chat"
version = "0.1.0"
description = "A local workspace for your databases"
authors = ["you"]
edition = "2024"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sapienta_db_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt", "time", "sync", "fs", "io-util"] }
tokio-postgres = "0.7"
native-tls = "0.2"
postgres-native-tls = "0.5"
# Use rustls for SQL Server: macOS native TLS fails the handshake with some SQL servers.
tiberius = { version = "0.13", default-features = false, features = ["tds73", "rustls"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
mongodb = "3"
rusqlite = { version = "0.41", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
object_store = { version = "0.12", default-features = false, features = ["aws"] }


[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
